[package]
name = "funk-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
funk-audio = { version = "0.1.0", path = "../funk-audio" }
funk-core = { version = "0.1.0", path = "../funk-core" }
ratatui = "0.30.2"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
