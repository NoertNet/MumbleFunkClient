[package]
name = "funk-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
prost = "0.14.4"
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1.44"

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.3.0"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
