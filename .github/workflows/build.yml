name: build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes older runs on the same branch pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: core logic and audio helpers (no GUI, so no Tauri/WebKit compile).
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo test --workspace --exclude funk-app

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every build gets a version that rises with the run number (tags use their own number), so the
      # in-app update check has something to compare and an installer can replace the previous one.
      # It is applied with `--config` (the TAURI_CONFIG env var is overwritten by the CLI itself).
      - name: Set app version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.1.$GITHUB_RUN_NUMBER"; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "FUNK_VERSION=$v" >> "$GITHUB_ENV"   # compiled into the app (see build_version in lib.rs)
      # Prebuilt CLI from npm instead of compiling cargo-tauri (~7 min).
      - run: npm install -g @tauri-apps/cli@^2
      - name: Build funk-probe
        run: cargo build --release -p funk-probe
      - uses: actions/upload-artifact@v4
        with:
          name: funk-probe-Windows
          path: target/release/funk-probe.exe
          if-no-files-found: error
      - name: Build app
        working-directory: app/src-tauri
        shell: bash
        run: tauri build --config "{\"version\":\"$APP_VERSION\"}"
      - uses: actions/upload-artifact@v4
        with:
          name: mumble-funk-Windows
          path: |
            target/release/bundle/**/*.msi
            target/release/bundle/**/*-setup.exe
          if-no-files-found: error

  linux:
    # Built on the oldest supported Ubuntu so the AppImage/deb also run on newer releases (glibc).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      # Every build gets a version that rises with the run number (tags use their own number), so the
      # in-app update check has something to compare and an installer can replace the previous one.
      # It is applied with `--config` (the TAURI_CONFIG env var is overwritten by the CLI itself).
      - name: Set app version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.1.$GITHUB_RUN_NUMBER"; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "FUNK_VERSION=$v" >> "$GITHUB_ENV"   # compiled into the app (see build_version in lib.rs)
      - run: npm install -g @tauri-apps/cli@^2
      - name: Build app
        working-directory: app/src-tauri
        env:
          NO_STRIP: "true"
        run: tauri build --bundles deb,appimage --config "{\"version\":\"$APP_VERSION\"}"
      - uses: actions/upload-artifact@v4
        with:
          name: mumble-funk-Linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Gradle's Rust plugin calls the CLI as `cargo tauri`; the npm shim is not found there.
      - name: Cache cargo-tauri
        id: tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: cargo-tauri-2-${{ runner.os }}
      - name: Install cargo-tauri
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked
      # Every build gets a version that rises with the run number (tags use their own number), so the
      # in-app update check has something to compare and an installer can replace the previous one.
      # It is applied with `--config` (the TAURI_CONFIG env var is overwritten by the CLI itself).
      - name: Set app version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.1.$GITHUB_RUN_NUMBER"; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "FUNK_VERSION=$v" >> "$GITHUB_ENV"   # compiled into the app (see build_version in lib.rs)
      - name: Locate NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
      - name: Init Android project
        working-directory: app/src-tauri
        run: cargo tauri android init --ci
      - name: Apply Funk Android patches
        if: hashFiles('app/android-patch.py') != ''
        run: python3 app/android-patch.py
      # Signing key: use the repository secrets ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD
      # if present; otherwise create a key once and keep it in the Actions cache. A stable key is what
      # lets a new APK update the installed app. (If the cache entry is ever evicted, a new key is
      # made and the app must be uninstalled once before the next update.)
      - name: Restore signing key cache
        uses: actions/cache@v4
        with:
          path: ~/funk-signing
          key: funk-android-signing-v1
      - name: Prepare signing key
        env:
          SECRET_KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          dir="$HOME/funk-signing"; mkdir -p "$dir"
          if [ -n "$SECRET_KS" ] && [ -n "$SECRET_PW" ]; then
            echo "$SECRET_KS" | base64 -d > "$dir/secret.p12"
            ks="$dir/secret.p12"; pw="$SECRET_PW"
            echo "Signaturschluessel: aus den Repository-Secrets (dauerhaft)"
          else
            ks="$dir/funk.p12"
            if [ ! -f "$ks" ] || [ ! -f "$dir/password.txt" ]; then
              pw=$(openssl rand -hex 24)
              echo "$pw" > "$dir/password.txt"
              rm -f "$ks"
              keytool -genkeypair -keystore "$ks" -storetype PKCS12 -alias funk -keyalg RSA -keysize 2048 \
                -validity 36500 -storepass "$pw" -keypass "$pw" -dname "CN=Mumble Funk, O=NoertNet"
              echo "Signaturschluessel: NEU erzeugt (im Cache abgelegt). Installierte App vorher einmal deinstallieren."
            else
              echo "Signaturschluessel: aus dem Cache (wird nach 7 Tagen ohne Nutzung geloescht; Secrets verhindern das)"
            fi
            pw=$(cat "$dir/password.txt")
          fi
          echo "::add-mask::$pw"
          echo "FUNK_KEYSTORE=$ks" >> "$GITHUB_ENV"
          echo "FUNK_KEYSTORE_PASSWORD=$pw" >> "$GITHUB_ENV"
      # Optimised release build (the debug profile makes the Opus codec far too slow), signed by
      # android-patch.py's gradle config. Tauri derives versionCode = major*1000000 + minor*1000 +
      # patch from the version (0.1.N -> 1000+N). Never set it separately: APKs built before the
      # version stamping all carry 1000, and a smaller code would be refused as a downgrade.
      - name: Build release APK
        working-directory: app/src-tauri
        run: |
          cargo tauri android build --apk --target aarch64 --ci --config "{\"version\":\"$APP_VERSION\"}"
      - name: Verify APK version
        run: |
          apk=$(find app/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          "$aapt2" dump badging "$apk" | grep -E "^package:"
          IFS=. read -r ma mi pa <<< "$APP_VERSION"
          code=$((ma * 1000000 + mi * 1000 + pa))
          "$aapt2" dump badging "$apk" | grep -q "versionName='$APP_VERSION'" || { echo "APK versionName is not $APP_VERSION" >&2; exit 1; }
          "$aapt2" dump badging "$apk" | grep -q "versionCode='$code'" || { echo "APK versionCode is not $code" >&2; exit 1; }
          [ "$code" -gt 1000 ] || { echo "versionCode $code would be a downgrade from earlier builds (1000)" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: mumble-funk-android
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # Publishes the finished builds as a GitHub Release so they can be downloaded without digging
  # through workflow artifacts. Branch pushes update the rolling pre-release "latest-dev";
  # pushing a tag like v0.2.0 creates a regular release.
  release:
    needs: [test, windows, linux, android]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/') || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect files
        run: |
          mkdir out
          pick() { f=$(find dist -name "$1" | head -1); if [ -n "$f" ]; then cp "$f" "out/$2"; else echo "missing: $1" >&2; fi; }
          pick '*-setup.exe' MumbleFunk-Windows-setup.exe
          pick '*.msi' MumbleFunk-Windows.msi
          pick '*.apk' MumbleFunk-Android.apk
          pick '*.deb' MumbleFunk-Linux.deb
          pick '*.AppImage' MumbleFunk-Linux.AppImage
          pick 'funk-probe.exe' funk-probe-Windows.exe
          for f in MumbleFunk-Android.apk MumbleFunk-Windows-setup.exe MumbleFunk-Linux.deb MumbleFunk-Linux.AppImage; do
            test -f "out/$f" || { echo "required file missing: $f" >&2; exit 1; }
          done
          # latest.json is what the app fetches at start to learn whether a newer build exists.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; v="${tag#v}"; else tag=latest-dev; v="0.1.$GITHUB_RUN_NUMBER"; fi
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          jq -n --arg v "$v" --arg c "$GITHUB_SHA" --arg b "$base" --arg page "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" \
            '{version: $v, commit: $c, page: $page, assets: {
                windows: ($b + "/MumbleFunk-Windows-setup.exe"),
                android: ($b + "/MumbleFunk-Android.apk"),
                "linux-appimage": ($b + "/MumbleFunk-Linux.AppImage"),
                "linux-deb": ($b + "/MumbleFunk-Linux.deb")}}' > out/latest.json
          cat out/latest.json
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          short="${GITHUB_SHA::7}"
          {
            echo "Automatischer Build von Commit \`$short\` auf \`$GITHUB_REF_NAME\`."
            echo
            echo "- **Android:** \`MumbleFunk-Android.apk\` herunterladen und installieren. Updates überschreiben die alte Version."
            echo "- **Windows:** \`MumbleFunk-Windows-setup.exe\` ausführen."
            echo "- **Ubuntu/Linux:** \`MumbleFunk-Linux.AppImage\` (ausführbar machen und starten) oder \`MumbleFunk-Linux.deb\` (\`sudo apt install ./MumbleFunk-Linux.deb\`)."
            echo "- Die App prüft beim Start selbst, ob hier eine neuere Version liegt (\`latest.json\`)."
            echo "- Prüfsummen: \`SHA256SUMS.txt\`"
          } > notes.md
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$GITHUB_REF_NAME" out/* --title "Mumble Funk $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
          else
            gh release delete latest-dev --cleanup-tag --yes 2>/dev/null || true
            gh release create latest-dev out/* --prerelease --target "$GITHUB_SHA" \
              --title "Neueste Entwicklungsversion ($short)" --notes-file notes.md
          fi
