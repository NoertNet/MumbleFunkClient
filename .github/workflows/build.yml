name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

# A newer push makes older runs on the same branch pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: core logic and audio helpers (no GUI, so no Tauri/WebKit compile).
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev cmake
      - run: cargo test --workspace --exclude funk-app

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Prebuilt CLI from npm instead of compiling cargo-tauri (~7 min).
      - run: npm install -g @tauri-apps/cli@^2
      - name: Build funk-probe
        run: cargo build --release -p funk-probe
      - uses: actions/upload-artifact@v4
        with:
          name: funk-probe-Windows
          path: target/release/funk-probe.exe
          if-no-files-found: error
      - name: Build app
        working-directory: app/src-tauri
        run: tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: mumble-funk-Windows
          path: |
            target/release/bundle/**/*.msi
            target/release/bundle/**/*-setup.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm install -g @tauri-apps/cli@^2
      - name: Locate NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
      - name: Init Android project
        working-directory: app/src-tauri
        run: tauri android init --ci
      - name: Apply Funk Android patches
        if: hashFiles('app/android-patch.py') != ''
        run: python3 app/android-patch.py
      - name: Build debug APK
        working-directory: app/src-tauri
        run: tauri android build --apk --debug --target aarch64 --ci
      - uses: actions/upload-artifact@v4
        with:
          name: mumble-funk-android-debug
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
